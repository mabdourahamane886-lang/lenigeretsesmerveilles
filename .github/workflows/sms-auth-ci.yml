name: SMS AUTH — Typecheck & Build
on:
  push:
    branches: [sms-auth-platform]
    paths:
      - "sms-auth/**"
      - ".github/workflows/sms-auth-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify SMS AUTH standalone project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
