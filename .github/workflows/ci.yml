name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Select Node.js 22 from the runner
        shell: bash
        run: |
          node_dir="$(find "${RUNNER_TOOL_CACHE}/node" -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -n 1)"
          test -x "${node_dir}/x64/bin/node"
          echo "${node_dir}/x64/bin" >> "$GITHUB_PATH"

      - name: Install pinned pnpm
        run: |
          pnpm_version="$(node -p 'require("./package.json").packageManager')"
          npm install --global --prefix "$RUNNER_TEMP/pnpm" "$pnpm_version"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
