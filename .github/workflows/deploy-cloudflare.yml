name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy with OpenNext
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFYO4L2FYabyQ91h
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact revision
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Select Node.js 22 from the runner
        shell: bash
        run: |
          node_dir="$(find "${RUNNER_TOOL_CACHE}/node" -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -n 1)"
          test -x "${node_dir}/x64/bin/node"
          echo "${node_dir}/x64/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build OpenNext output
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx opennextjs-cloudflare deploy

      - name: Report missing Cloudflare credentials
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub repository Actions secrets."
          exit 1
